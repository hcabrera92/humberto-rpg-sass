<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humberto RPG</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header id="header"></header>
    <section id="chapter1" #chapter1></section>
    <section id="chapter2" #chapter2></section>
    <section id="chapter3" #chapter3></section>
    <section id="chapter4" #chapter4></section>
    <section id="chapter5" #chapter5></section>
    <footer id="footer"></footer>
    
    <script src="assets/js/toggle-menu.js"></script>
    <script src="assets/js/score-animation.js"></script>
    <script src="assets/js/fade-text-animation.js"></script>
    <script src="assets/js/carousel-animation.js"></script>
    <script src="assets/js/append-sections.js"></script>

    <script>
    window.addEventListener('load', () => {
        const hash = window.location.hash;
        if (hash) {
            setTimeout(() => {
                const el = document.querySelector(hash);
                if (el) el.scrollIntoView({ behavior: 'instant' });
            }, 05);
        }
    });
</script>
  </body>
</html>
